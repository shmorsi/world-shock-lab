<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 276" width="760" height="276" role="img" aria-label="Pooled scaled error of each model on the held-out test announcements" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif">
<title>Pooled scaled error of each model on the held-out test announcements</title>
<rect width="760" height="276" fill="#ffffff"/>
<text x="16.0" y="22.0" font-size="14" fill="#121722" text-anchor="start" font-weight="600">Held-out test announcements: pooled scaled error (lower is better)</text>
<text x="16.0" y="40.0" font-size="11.5" fill="#5d6677" text-anchor="start" font-weight="400">1.00 = the training-period error of predicting no move</text>
