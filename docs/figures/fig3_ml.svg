<text x="317.9" y="248.0" font-size="10.5" fill="#5d6677" text-anchor="middle" font-weight="400">1.15</text>
<line x1="525.9" y1="52.0" x2="525.9" y2="232.0" stroke="#e3e7ee" stroke-width="1"/>
<text x="525.9" y="248.0" font-size="10.5" fill="#5d6677" text-anchor="middle" font-weight="400">1.20</text>
<line x1="504.0" y1="52.0" x2="504.0" y2="232.0" stroke="#5d6677" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="16.0" y="71.0" font-size="12" fill="#485164" text-anchor="start" font-weight="400">No move (B0)</text>
<line x1="190.0" y1="67.0" x2="504.0" y2="67.0" stroke="#e3e7ee" stroke-width="1"/>
<circle cx="504.0" cy="67.0" r="6" fill="#485164"/>
<text x="514.0" y="71.0" font-size="11" fill="#485164" text-anchor="start" font-weight="400">1.195</text>
<text x="16.0" y="101.0" font-size="12" fill="#485164" text-anchor="start" font-weight="400">Linear LP (B1)</text>
<line x1="190.0" y1="97.0" x2="284.9" y2="97.0" stroke="#e3e7ee" stroke-width="1"/>
<circle cx="284.9" cy="97.0" r="6" fill="#2a78d6"/>
<text x="294.9" y="101.0" font-size="11" fill="#485164" text-anchor="start" font-weight="400">1.142</text>
<text x="16.0" y="131.0" font-size="12" fill="#485164" text-anchor="start" font-weight="400">State-dependent LP (B2)</text>
<line x1="190.0" y1="127.0" x2="575.2" y2="127.0" stroke="#e3e7ee" stroke-width="1"/>
<circle cx="575.2" cy="127.0" r="6" fill="#485164"/>
<text x="585.2" y="131.0" font-size="11" fill="#485164" text-anchor="start" font-weight="400">1.212</text>
<text x="16.0" y="161.0" font-size="12" fill="#485164" text-anchor="start" font-weight="400">Ridge (B3)</text>
<line x1="190.0" y1="157.0" x2="361.2" y2="157.0" stroke="#e3e7ee" stroke-width="1"/>
<circle cx="361.2" cy="157.0" r="6" fill="#485164"/>
<text x="371.2" y="161.0" font-size="11" fill="#485164" text-anchor="start" font-weight="400">1.160</text>
<text x="16.0" y="191.0" font-size="12" fill="#485164" text-anchor="start" font-weight="400">Gradient boosting (B4)</text>
<line x1="190.0" y1="187.0" x2="306.5" y2="187.0" stroke="#e3e7ee" stroke-width="1"/>
<circle cx="306.5" cy="187.0" r="6" fill="#485164"/>
<text x="316.5" y="191.0" font-size="11" fill="#485164" text-anchor="start" font-weight="400">1.147</text>
