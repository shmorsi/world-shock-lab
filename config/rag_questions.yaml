# Ask the decisions: the fixed question set (protocol: config/rag_protocol.yaml).
#
# Written before any retriever existed and tagged `rag-v1` with the protocol. Each question is
# phrased the way a reader would ask it, avoiding where possible the statement's own words.
# `gold` lists every statement that answers it; a retriever scores a hit when any of them is
# in its top k. Labels come from reading the statements in data/rag/statements.jsonl.
# `dev` questions were used to build and debug the pipeline. `test` questions are scored once.
