name: live

# Pre-registered live mode (docs/EVALUATION_PROTOCOL.md §8, config/live.yaml).
# Every weekday after the North American closes: download fresh data, score decisions whose
# outcomes are now published, publish forecasts for decisions in the next ten days, commit the
# new files (never editing old ones) and redeploy the site.
on:
  schedule:
    - cron: "30 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  actions: write # to start the pages workflow

concurrency:
  group: live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    env:
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Without the key there is no US 2-year or USD/CAD data, so nothing can be scored or
      # forecast. The run then says so in the log and the job summary, lists the forecasts and
      # scores it skipped, and fails only when a forecast is due: a forecast that misses its
      # 24-hour deadline can never count, while scores can be computed later. Until the secret
      # is added, run `uv run wsl live run` locally and push (docs/SHIP_CHECKLIST.md).
      - name: Report the skip (FRED_API_KEY secret is not set)
        if: env.FRED_API_KEY == ''
        run: uv run --no-project --with pyyaml==6.0.3 python -m wsl.live.pending --no-key

      - if: env.FRED_API_KEY != ''
        run: uv sync --locked --no-dev
      - name: Score finished decisions and publish due forecasts
        if: env.FRED_API_KEY != ''
        run: uv run --no-dev wsl live run
      - name: Commit new forecasts and scores
        if: env.FRED_API_KEY != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add live
          if git diff --cached --quiet; then
            echo "No new forecasts or scores today."
            exit 0
          fi
          git add web/public/data/live.json
          git config user.name "world-shock-lab live"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "live: new forecasts or scores ($(date -u +%Y-%m-%d))"
          git push
          gh workflow run pages.yml --ref "${GITHUB_REF_NAME}"
      # Runs even if a step above failed: what is published, what is still owed, and an error
      # if a forecast that is due was not written.
      - name: Report what is still owed
        if: always() && env.FRED_API_KEY != ''
        run: uv run --no-project --with pyyaml==6.0.3 python -m wsl.live.pending
