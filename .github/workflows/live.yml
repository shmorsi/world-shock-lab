name: live

# Pre-registered live mode (docs/EVALUATION_PROTOCOL.md §8, config/live.yaml).
#
# Schedule: 22:30 UTC, Monday–Friday (`30 22 * * 1-5`). That is 18:30 in America/New_York
# while daylight time is in effect (through 2026-11-01) and 17:30 after the clocks change.
# GitHub often starts the run late; recent runs of this workflow began about 1–2 hours
# after 22:30 UTC. There is no Saturday or Sunday run.
#
# The 2026-10-28 Bank of Canada announcement is 09:45 America/Toronto (13:45 UTC) and the
# FOMC statement is 14:00 America/New_York (18:00 UTC), so both are over before that day's
# scheduled run. Score 1 is still not written that day. It is written on the first later
# weekday run whose download contains every h = 5 outcome (USD/CAD is the weekly H.10
# rate, so the protocol expects this about 6–10 days after the decision). Score 2, FOMC
# only, is written on the first run after Jarociński–Karadi's file lists that meeting.
# Each file is written once and never edited. The job then commits it. The lab's app is
# served as part of shmorsi.github.io (shock-lab/ there): that site's daily sync builds it
# from this repository's main, so a new forecast or score appears there without a deploy here.
on:
  schedule:
    - cron: "30 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live
  cancel-in-progress: false

jobs:
  live:
    # Schedule events run on the default branch. A manual run has to be on main as well,
    # so a score cannot be committed from another branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      # Optional. The secret is the only place a key is read; the job runs without it.
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # With the secret, the two FRED series (US 2-year yield, USD/CAD) come from the FRED
      # API. Without it they come from FRED's public CSV download: the same observations, no
      # key (wsl/live/data.py). FRED's website refused this runner on 2026-11-11 (read timeouts),
      # so on GitHub the secret is what makes the job work; without it the run stops within a
      # few minutes, before writing anything, and says so.
      - name: Choose the FRED route
        id: fred
        run: |
          if [ -n "$FRED_API_KEY" ]; then route=api; else route=csv; fi
          echo "route=$route" >> "$GITHUB_OUTPUT"
          echo "FRED route for this run: $route"

      - name: Install
        run: uv sync --locked --no-dev

      # Stops with an error, before writing anything, if any download fails.
      - name: Score finished decisions and publish due forecasts
        run: uv run --no-dev wsl live run

      # The README's "Live forecasts" line and the research note count the scored decisions
      # (tests/test_docs.py fails when they no longer match live/), so they are regenerated
      # here and committed with the files they describe. On a day with nothing new they come
      # out unchanged.
      - name: Regenerate the documents that quote the live results
        run: uv run --no-dev wsl report docs

      - name: Commit new forecasts and scores
        run: |
          # actions/checkout leaves a detached HEAD. A bare `git push` then has no branch
          # to update, so the 2026-10-28 scores would never reach main. Name the branch.
          git add live
          if git diff --cached --quiet; then
            echo "No new forecasts or scores today."
            exit 0
          fi
          git add web/public/data/live.json README.md docs/RESEARCH_NOTE.md docs/figures
          git config user.name "world-shock-lab live"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "live: new forecasts or scores ($(date -u +%Y-%m-%d))"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      # Runs even if a step above failed: the route this run read FRED by, what is still
      # owed, and an error if a forecast that is due was not written.
      - name: Report what is still owed
        if: always()
        run: uv run --no-project --with pyyaml==6.0.3 python -m wsl.live.pending --route "${{ steps.fred.outputs.route }}"
