[project]
name = "world-shock-lab"
version = "0.1.0"
description = "How the world, and Canada in particular, reacts to identified economic shocks"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Sherif Morsi" }]
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=17",
    "duckdb>=1.1",
    "pandera>=0.22",
    "requests>=2.32",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "beautifulsoup4>=4.12",
    "typer>=0.12",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
    "torch>=2.14.1",
    "scikit-learn>=1.9.1",
]

[project.urls]
Homepage = "https://shmorsi.github.io/"
"Live site" = "https://shmorsi.github.io/world-shock-lab/"
"Case study" = "https://shmorsi.github.io/projects/world-shock-lab.html"
Repository = "https://github.com/shmorsi/world-shock-lab"

[project.scripts]
wsl = "wsl.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "types-requests>=2.32",
    "types-PyYAML>=6.0",
]

# On Linux (CI, the live workflow) take torch from PyTorch's CPU-only index: the default
# PyPI wheel pulls about 3 GB of CUDA libraries the project never uses. macOS is unchanged.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wsl"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # allow unicode (×, –, ¼) in strings and comments

[tool.ruff.lint.per-file-ignores]
"wsl/report/docs.py" = ["E501"]  # document templates: one Markdown paragraph per line
"wsl/mlstudy/report.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true

# Strict on the core data-integrity modules.
[[tool.mypy.overrides]]
module = [
    "wsl.paths",
    "wsl.timing",
    "wsl.data.cache",
    "wsl.data.http",
    "wsl.data.registry",
    "wsl.data.transforms",
    "wsl.estimation.ols",
    "wsl.estimation.irf",
    "wsl.estimation.lp",
    "wsl.estimation.lpiv",
    "wsl.estimation.simulate",
]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "data: needs the built local data (run `uv run wsl data build` first)",
]
addopts = "-m 'not data'"
