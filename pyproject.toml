[project]
name = "world-shock-lab"
version = "0.1.0"
description = "How the world, and Canada in particular, reacts to identified economic shocks"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=17",
    "duckdb>=1.1",
    "pandera>=0.22",
    "requests>=2.32",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "beautifulsoup4>=4.12",
    "typer>=0.12",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
    "torch>=2.14.1",
    "scikit-learn>=1.9.1",
]

[project.scripts]
wsl = "wsl.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "types-requests>=2.32",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wsl"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # allow unicode (×, –, ¼) in strings and comments

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true

# Strict on the core data-integrity modules.
[[tool.mypy.overrides]]
module = [
    "wsl.paths",
    "wsl.timing",
    "wsl.data.cache",
    "wsl.data.http",
    "wsl.data.registry",
    "wsl.data.transforms",
    "wsl.estimation.ols",
    "wsl.estimation.irf",
    "wsl.estimation.lp",
    "wsl.estimation.lpiv",
    "wsl.estimation.simulate",
]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "data: needs the built local data (run `uv run wsl data build` first)",
]
addopts = "-m 'not data'"
